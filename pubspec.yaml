name: habit_tracker
description: A premium habit tracking mobile app with beautiful animations and gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^13.2.5
  
  # Database (Drift/SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  
  # UI Components
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.3
  fl_chart: ^0.65.0
  table_calendar: ^3.0.9
  
  # Animations
  flutter_animate: ^4.5.2
  lottie: ^2.7.0
  
  # Notifications
  flutter_local_notifications: ^18.0.0
  
  # Audio & Haptics
  vibration: ^2.0.0
  audioplayers: ^5.2.1
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0
  path: ^1.9.0
  
  # Firebase & Auth
  firebase_core: ^3.12.1
  firebase_auth: ^5.6.1
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.5
  googleapis: ^15.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  archive: ^3.6.1
  font_awesome_flutter: ^10.12.0
  url_launcher: ^6.2.5
  google_mobile_ads: ^5.1.0
  
  # AWS Amplify
  amplify_flutter: ^2.6.0
  amplify_auth_cognito: ^2.6.0
  amplify_api: ^2.6.0
  
  # UI Components
  pinput: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  
  # Testing
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
